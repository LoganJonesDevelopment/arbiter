services:
  backend:
    build: ./backend
    ports:
      # LAN + loopback only — the tailscale IP stays free for tailscale serve (HTTPS)
      - "192.168.0.21:8890:8888"
      - "127.0.0.1:8890:8888"
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/arbiter.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # LAN + loopback only — the tailscale IP stays free for tailscale serve (HTTPS)
      - "192.168.0.21:8889:80"
      - "127.0.0.1:8889:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
